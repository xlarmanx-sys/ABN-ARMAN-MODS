<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ABN Arman</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="enter-screen">
    <h1>Click to enter</h1>
</div>

<video autoplay loop muted playsinline id="bg-video">
    <source src="bg.mp4" type="video/mp4">
</video>

<div class="content">
    <h1>ABN ARMAN</h1>
    <p>Mod Menu & Exe Maker</p>
    <div class="socials">
        <a href="https://discord.gg/3hjwWmGs" target="_blank">
          <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png">
        </a>
        <a href="https://www.tiktok.com/@arman.p20jod?_r=1&_t=ZS-97uS0IQjxsP" target="_blank">
          <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png">
        </a>
    </div>
</div>

<script>
    const enter = document.getElementById('enter-screen');
    const video = document.getElementById('bg-video');
    const content = document.querySelector('.content');

    enter.onclick = () => {
        enter.style.display = 'none';
        content.style.display = 'block';
        video.muted = false;
        video.play();
    }
</script>

</body>
</html>
